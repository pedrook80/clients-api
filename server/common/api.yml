openapi: 3.0.0
info:
  title: API de Clientes
  version: 1.0.0
  description: API para cadastro e gerenciamento de clientes com autenticação JWT

servers:
  - url: http://localhost:3000

paths:
  /user:
    post:
      tags:
        - Usuários
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required: [name, email, password]
      responses:
        '201':
          description: Usuário criado com sucesso
        '400':
          description: Erro ao criar usuário

  /user/login:
    post:
      tags:
        - Usuários
      summary: Autentica o usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Token JWT retornado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Erro de autenticação

  /clients:
    post:
      tags:
        - Clientes
      summary: Cadastra um novo cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cpf:
                  type: string
                emails:
                  type: array
                  items:
                    type: string
                phones:
                  type: array
                  items:
                    type: string
              required: [name, cpf, emails, phones]
      responses:
        '201':
          description: Cliente criado com sucesso
        '400':
          description: Erro ao criar cliente

    get:
      tags:
        - Clientes
      summary: Lista clientes com filtros opcionais
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ddd
          schema:
            type: string
          description: Filtra clientes pelo DDD do telefone
        - in: query
          name: name
          schema:
            type: string
          description: Filtra clientes por parte do nome
      responses:
        '200':
          description: Lista de clientes
        '401':
          description: Token inválido ou ausente

    put:
      tags:
        - Clientes
      summary: Atualiza um cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                cpf:
                  type: string
                emails:
                  type: array
                  items:
                    type: string
                phones:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Cliente atualizado
        '400':
          description: Erro ao atualizar

  /clients/{id}:
    get:
      tags:
        - Clientes
      summary: Retorna os dados de um cliente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente encontrado
        '404':
          description: Cliente não encontrado

    delete:
      tags:
        - Clientes
      summary: Remove um cliente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cliente removido
        '404':
          description: Cliente não encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
